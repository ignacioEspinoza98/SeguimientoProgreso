<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Entrenamientos | Progreso Gym</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/Dashboard.css" />
  <link rel="stylesheet" href="../css/registroEntrenamientos.css" />
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar">
    <div class="nav-contenedor">
      <a href="#" class="nav-logo">
        <i class="fas fa-dumbbell"></i>
        <span>Progreso Gym</span>
      </a>
      <div class="nav-botones">
        <a href="Historial.html" class="boton boton-secundario">
          <i class="fas fa-history"></i> Historial
        </a>
        <button id="cerrarSesion" class="boton boton-primario">
          <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </nav>
  <main class="contenedor">
    <section class="seccion-bienvenida">
      <h1 class="saludo">Registra tu entrenamiento</h1>
      <p>Completa los siguientes campos para registrar tu sesión de entrenamiento.</p>
    </section>

    <form id="formulario-entrenamiento" class="formulario-entrenamiento">
      <div class="select-contenedor">
        <label for="grupoMuscular" class="select-label">
          <i class="fas fa-dumbbell"></i> Grupo muscular
        </label>
        <select id="grupoMuscular" class="select-estilizado" required>
          <option value="">Selecciona un grupo muscular</option>
          <!-- Se cargan dinámicamente -->
        </select>
      </div>

      <div class="select-contenedor">
        <label for="ejercicio" class="select-label">
          <i class="fas fa-dumbbell"></i> Ejercicio
        </label>
        <select id="ejercicio" class="select-estilizado" required disabled>
          <option value="">Selecciona un ejercicio</option>
        </select>
      </div>

      <div class="grupo-inputs">
        <div class="input-contenedor">
          <label for="peso" class="input-label">Peso (kg)</label>
          <div class="input-con-icono">
            <i class="fas fa-weight"></i>
            <input type="number" id="peso" class="input-estilizado" required min="0" step="0.5" />
          </div>
          <small class="error" id="errorPeso"></small>
        </div>
        
        <div class="input-contenedor">
          <label for="repeticiones" class="input-label">Repeticiones</label>
          <div class="input-con-icono">
            <i class="fas fa-redo"></i>
            <input type="number" id="repeticiones" class="input-estilizado" required min="1" />
          </div>
          <small class="error" id="errorRepeticiones"></small>
        </div>
        
        <div class="input-contenedor">
          <label for="series" class="input-label">Series</label>
          <div class="input-con-icono">
            <i class="fas fa-layer-group"></i>
            <input type="number" id="series" class="input-estilizado" required min="1" />
          </div>
          <small class="error" id="errorSeries"></small>
        </div>
      </div>

      <div class="form-acciones">
        <button type="submit" class="boton boton-primario" disabled>
          <i class="fas fa-plus-circle"></i> Agregar ejercicio
        </button>
      </div>
      
      <div class="botones-secundarios">
        <button type="button" id="vaciarSesion" class="boton boton-secundario">
          <i class="fas fa-trash-alt"></i> Vaciar Sesión
        </button>
        <a href="Dashboard.html" class="boton boton-secundario">
          <i class="fas fa-tachometer-alt"></i> Ir al Dashboard
        </a>
        <a href="AnalisisRendimiento.html" class="boton boton-secundario">
          <i class="fas fa-chart-line"></i> Ver Análisis
        </a>
      </div>
    </form>

    <section class="seccion-resumen">
      <h2 class="seccion-titulo">
        <i class="fas fa-clipboard-list"></i> Resumen de la sesión
      </h2>
      
      <div class="tabla-contenedor">
        <table id="tabla-resumen" class="tabla-estilizada">
          <thead>
            <tr>
              <th>Ejercicio</th>
              <th>Peso (kg)</th>
              <th>Reps</th>
              <th>Series</th>
              <th>Volumen</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Se agregan dinámicamente -->
            <tr class="sin-datos">
              <td colspan="6">
                <i class="fas fa-clipboard"></i>
                <p>No hay ejercicios agregados</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div class="resumen-acciones">
        <button id="finalizarSesion" class="boton boton-primario" disabled>
          <i class="fas fa-check-circle"></i> Finalizar Sesión
        </button>
      </div>
    </section>

  </main>
  <script src="../js/Auth.js"></script>
  <script src="../js/CerrarSesion.js"></script>
  <script src="../js/registroEntrenamientos.js"></script>
</body>
</html>
