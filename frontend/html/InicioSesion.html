<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Progreso Gym</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="contenedor">
    <h1>Domina tus límites, dale con intensidad cada repetición</h1>

    <div class="formulario">
      <form id="InicioSesionForm">
        <h2>Iniciar Sesión</h2>
        <p class="text-muted">Ingresa tus credenciales para acceder a tu cuenta</p>
        <div class="grupo-formulario">
          <label for="Correo">Correo Electrónico</label>
          <div class="input-con-icono">
            <i class="fas fa-envelope"></i>
            <input type="email" id="Correo" placeholder="tu@correo.com" required>
          </div>
        </div>
        
        <div class="grupo-formulario">
          <div class="etiqueta-contenedor">
            <label for="Contraseña">Contraseña</label>
            <a href="recuperar-contrasena.html" class="enlace-pequeno">¿Olvidaste tu correo o contraseña?</a>
          </div>
          <div class="input-con-icono">
            <i class="fas fa-lock"></i>
            <input type="password" id="Contraseña" placeholder="••••••••" required>
            <button type="button" class="toggle-password">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>
                            
        <button type="submit" class="boton" id="IniciarSesionBtn">
          <span class="spinner"></span>
          <span>Iniciar Sesión</span>
        </button>

        <div class="separador">
          <span>o inicia sesión con</span>
        </div>

        <button type="button" class="boton google-btn" id="googleSignIn">
          <img src="https://www.google.com/favicon.ico" alt="Google" width="20">
          <span>Continuar con Google</span>
        </button>

        <p class="texto-centrado">
          ¿No tienes una cuenta? <a href="Registro.html" class="enlace">Regístrate</a>
        </p>
      </form>
    </div>
  </div>

  <!-- jQuery (necesario para Bootstrap) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- SweetAlert2 para alertas bonitas -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Font Awesome para iconos -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  
  <!-- Scripts de Firebase -->
  <script>
    // Esperar a que todo el DOM esté cargado
    document.addEventListener('DOMContentLoaded', function() {
      // Cargar configuración de Firebase
      const firebaseScript = document.createElement('script');
      firebaseScript.src = '../js/firebase-config.js';
      firebaseScript.onload = function() {
        // Una vez que Firebase esté listo, cargar el script de inicio de sesión
        const loginScript = document.createElement('script');
        loginScript.src = '../js/InicioSesion.js';
        document.body.appendChild(loginScript);
      };
      document.body.appendChild(firebaseScript);
    });
  </script>
  <!-- Efecto de partículas -->
  <div class="particulas" id="particulas"></div>
  
  <!-- Script para partículas -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const particulas = document.getElementById('particulas');
      const numParticulas = 30;
      
      for (let i = 0; i < numParticulas; i++) {
        const particula = document.createElement('div');
        particula.className = 'particula';
        
        // Tamaño aleatorio
        const size = Math.random() * 15 + 5;
        particula.style.width = `${size}px`;
        particula.style.height = `${size}px`;
        
        // Posición aleatoria
        particula.style.left = `${Math.random() * 100}%`;
        particula.style.top = `${Math.random() * 100}%`;
        
        // Opacidad aleatoria
        particula.style.opacity = Math.random() * 0.5 + 0.1;
        
        // Animación personalizada
        const duration = Math.random() * 20 + 10;
        const delay = Math.random() * -20;
        particula.style.animation = `flotar ${duration}s linear ${delay}s infinite`;
        
        particulas.appendChild(particula);
      }
    });
  </script>
</body>
</html>
