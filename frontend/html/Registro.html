<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/Registro.css">
    <title>Registro</title>
</head>
<body>

<header>


</header>


<section class="ContenidoPrincipal">

    <div class="ContenedorFormulario">

        <span id="Registro">Registro de usuarios</span>
  
        <div class="ItemsFormulario">

            <form id="RegistroForm">

                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="Usuario" class="form-control">
                    <div id="usuarioFeedback" class="feedback"></div>
                </div>

                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" id="Correo" class="form-control">
                    <div id="correoFeedback" class="feedback"></div>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="Contraseña" class="form-control">
                    <div id="passwordFeedback" class="feedback"></div>
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="ConfirmarContraseña" class="form-control">
                    <div id="confirmPasswordFeedback" class="feedback"></div>
                </div>

                <input type="submit" value="Registrar" id="RegistroBtn">

                <label id="Pregunta">¿Ya tienes una cuenta?<a id="LinkRegistro" href="../html/InicioSesion.html">Inicia Sesion</a></label>

            </form>


        </div>


    </div>



</section>


<footer>


</footer>


<!-- Scripts -->
<script src="../js/Registro.js"></script>
</body>
</html>
