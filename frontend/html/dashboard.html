<!-- frontend/html/Dashboard.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="../css/Dashboard.css" />
</head>
<body>
  <button id="cerrarSesion" class="boton-cerrar">Cerrar sesión</button>
  <main class="contenedor">
    <h1>Domina tus límites,<br>dale con intensidad cada repetición!</h1>

    <section class="estadisticas">
      <div class="box">
        <h3>Series por Grupo Muscular (semana)</h3>
        <ul id="seriesPorGrupo" style="list-style: none; padding: 0; margin: 0;"></ul>
      </div>
      <div class="box">
        <h3>Peso Máximo</h3>
        <p id="pesoMaximo">--</p>
      </div>
      <div class="box">
        <h3>Último Entrenamiento</h3>
        <p id="ultimoEntreno">--</p>
      </div>
      <div class="box">
        <h3>Series Realizadas Esta Semana</h3>
        <p id="seriesSemana">--</p>
      </div>
      <div class="box">
        <h3>Volumen por Grupo Muscular (semana)</h3>
        <ul id="volumenPorGrupo" style="list-style: none; padding: 0; margin: 0;"></ul>
      </div>
    </section>

    <div class="acciones">
      <a href="RegistroEntrenamientos.html" class="boton">Registrar Entrenamiento</a>
      <a href="AnalisisRendimiento.html" class="boton secundario">Ver Análisis</a>
    </div>
  </main>

  <script src="../js/Auth.js"></script>
  <script src="../js/Dashboard.js"></script>
  <script src="../js/CerrarSesion.js"></script>
</body>
</html>
